name: 'tpch_orders_analysis'
version: '1.0.0'
config-version: 2
profile: 'tpch_orders_analysis'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  tpch_orders_analysis:
    staging:
      +materialized: view  # Efêmero para limpeza
      +snowflake_warehouse: dbt_wh
    core:
      +materialized: incremental  # Corrigido case; merge para Snowflake
      +snowflake_warehouse: dbt_wh
      +incremental_strategy: merge
      
